        - path: /home/agent/.pi/agent/extensions/gcp-anthropic.ts
          mode: "0644"
          overwrite: false
          content: |
            import { getApiProvider } from "@earendil-works/pi-ai/compat";
            import type { ExtensionAPI } from "@earendil-works/pi-coding-agent";

            export default function (pi: ExtensionAPI) {
              const anthropicApi = getApiProvider("anthropic-messages");
              if (!anthropicApi) return;

              pi.registerProvider("gcp-anthropic", {
                api: "anthropic-messages",
                streamSimple: (model, context, options) => {
                  const baseFetch = options?.fetch ?? globalThis.fetch;
                  const vertexFetch: typeof fetch = async (input, init) => {
                    const rawUrl =
                      typeof input === "string" ? input : input instanceof URL ? input.href : input.url;
                    const url = new URL(rawUrl);
                    const body = typeof init?.body === "string" ? JSON.parse(init.body) : undefined;
                    const modelId = body?.model ?? model.id;
                    if (body) {
                      delete body.model;
                      delete body.fallbacks;
                      body.anthropic_version ??= "vertex-2023-10-16";
                    }
                    const specifier = body?.stream ? "streamRawPredict" : "rawPredict";
                    url.pathname = url.pathname.replace(/\/v1\/messages$/, `/models/${modelId}:${specifier}`);
                    url.searchParams.delete("beta");
                    return baseFetch(url.toString(), {
                      ...init,
                      body: body ? JSON.stringify(body) : init?.body,
                    });
                  };

                  return anthropicApi.streamSimple(model, context, {
                    ...options,
                    apiKey: undefined,
                    fetch: vertexFetch,
                  });
                },
              });
            }

  # --------------------------------------
  # Agent Platform network access
  # --------------------------------------

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - aiplatform.googleapis.com

  # --------------------------------------
  # GCP authentication
  # --------------------------------------

  - type: com.docker.sandbox/credential@1
    description: Google Cloud Agent Platform AI
    config:
      service: gcp-vertex
      phase: runtime

      apiKey:
        name: GCP_VERTEX_ACCESS_TOKEN
        proxyManaged: true

        inject:
          - domain: aiplatform.googleapis.com
            header: Authorization
            format: "Bearer %s"
