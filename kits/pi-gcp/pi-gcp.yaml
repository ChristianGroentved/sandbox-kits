# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json

schemaVersion: "3"
kind: mixin

displayName: Pi GCP Models
description: Adds GCP-hosted models to Pi through Agent Platform AI
version: "0.1.0" # x-release-please-version

args:
  project:
    required: true
    description: GCP project containing the Agent Platform models

  location:
    default: global
    description: Agent Platform AI endpoint location

capabilities:
  # --------------------------------------
  # models.json
  # --------------------------------------

  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        - path: /home/agent/.pi/agent/models.json
          mode: "0644"
          overwrite: false
          content: |
            {
              "providers": {
                "gcp-oss-maas": {
                  "baseUrl": "https://aiplatform.googleapis.com/v1/projects/${{ kit.args.project }}/locations/${{ kit.args.location }}/endpoints/openapi",
                  "api": "openai-completions",
                  "apiKey": "$GCP_VERTEX_ACCESS_TOKEN",
                  "authHeader": true,
                  "models": [
                    {
                      "id": "qwen/qwen3-next-80b-a3b-thinking-maas",
                      "displayName": "Qwen 3 Next 80B Thinking (Agent Platform MaaS)",
                      "contextWindow": 262144,
                      "cost": {"input": 0.15, "output": 1.2}
                    },
                    {
                      "id": "qwen/qwen3-next-80b-a3b-instruct-maas",
                      "displayName": "Qwen 3 Next 80B Instruct (Agent Platform MaaS)",
                      "contextWindow": 262144,
                      "cost": {"input": 0.15, "output": 1.2}
                    },
                    {
                      "id": "qwen/qwen3-coder-480b-a35b-instruct-maas",
                      "displayName": "Qwen 3 Coder 480B Instruct (Agent Platform MaaS)",
                      "contextWindow": 258000,
                      "cost": {"input": 0.2, "output": 1.62, "cacheRead": 0.02}
                    },
                    {
                      "id": "zai-org/glm-5.2-maas",
                      "displayName": "GLM 5.2 (Agent Platform MaaS)",
                      "contextWindow": 1000000,
                      "cost": {"input": 1.4, "output": 4.4, "cacheRead": 0.14}
                    },
                    {
                      "id": "zai-org/glm-5-maas",
                      "displayName": "GLM 5 (Agent Platform MaaS)",
                      "contextWindow": 200000,
                      "cost": {"input": 1, "output": 3.2, "cacheRead": 0.1}
                    },
                    {
                      "id": "deepseek-ai/deepseek-v3.2-maas",
                      "displayName": "Deepseek v3.2 (Agent Platform MaaS)",
                      "contextWindow": 163840,
                      "cost": {"input": 0.56, "output": 1.68, "cacheRead": 0.056}
                    },
                    {
                      "id": "moonshotai/kimi-k2-thinking-maas",
                      "displayName": "Kimi K2 Thinking (Agent Platform MaaS)",
                      "contextWindow": 262144,
                      "cost": {"input": 0.6, "output": 2.5, "cacheRead": 0.06}
                    },
                    {
                      "id": "moonshotai/minimaxai/minimax-m2-maas",
                      "displayName": "Minimax M2 (Agent Platform MaaS)",
                      "contextWindow": 196608,
                      "cost": {"input": 0.3, "output": 1.2, "cacheRead": 0.03}
                    }
                  ]
                }
              }
            }

  # --------------------------------------
  # Agent Platform network access
  # --------------------------------------

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - aiplatform.googleapis.com

  # --------------------------------------
  # GCP authentication
  # --------------------------------------

  - type: com.docker.sandbox/credential@1
    description: Google Cloud Agent Platform AI
    config:
      service: gcp-vertex
      phase: runtime

      apiKey:
        name: GCP_VERTEX_ACCESS_TOKEN
        proxyManaged: true

        inject:
          - domain: aiplatform.googleapis.com
            header: Authorization
            format: "Bearer %s"
