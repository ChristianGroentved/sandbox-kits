# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json

schemaVersion: "3"
kind: mixin

displayName: Pi GCP Models
description: Adds GCP-hosted models to Pi through Agent Platform AI
version: "0.3.0" # x-release-please-version

args:
  project:
    required: true
    description: GCP project containing the Agent Platform models

  location:
    default: global
    description: Agent Platform AI endpoint location

capabilities:
  # --------------------------------------
  # models.json
  # --------------------------------------

  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
