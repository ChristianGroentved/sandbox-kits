# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json

schemaVersion: "3"
kind: mixin

displayName: Pi GCP Models
description: Adds GCP-hosted models to Pi through Vertex AI
version: "0.1.0"

args:
  project:
    required: true
    description: GCP project containing the Vertex models

  location:
    default: global

capabilities:
  # --------------------------------------
  # models.json
  # --------------------------------------

  - type: com.docker.sandbox/lifecycle@1
    config:
      files:
        - path: /home/agent/.pi/agent/models.json
          mode: "0644"
          overwrite: false
          content: |
            {
              "providers": {
                "gcp-oss-maas": {
                  "baseUrl": "https://aiplatform.googleapis.com/v1/projects/${{ kit.args.project }}/locations/${{ kit.args.location }}/endpoints/openapi",
                  "api": "openai-completions",
                  "apiKey": "$GCP_VERTEX_ACCESS_TOKEN",
                  "authHeader": true,
                  "models": [
                    {
                      "id": "qwen/qwen3-next-80b-a3b-thinking-maas",
                      "displayName": "Qwen 3 Next 80B Thinking (Vertex MaaS)"
                    },
                    {
                      "id": "zai-org/glm-5.2-maas",
                      "displayName": "GLM 5.2 (Vertex MaaS)"
                    },
                    {
                      "id": "zai-org/glm-5-maas",
                      "displayName": "GLM 5 (Vertex MaaS)"
                    }
                  ]
                }
              }
            }

  # --------------------------------------
  # Vertex network access
  # --------------------------------------

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - aiplatform.googleapis.com

  # --------------------------------------
  # GCP authentication
  # --------------------------------------

  - type: com.docker.sandbox/credential@1
    description: Google Cloud Vertex AI
    config:
      service: gcp-vertex
      phase: runtime

      apiKey:
        name: GCP_VERTEX_ACCESS_TOKEN
        proxyManaged: true

        inject:
          - domain: aiplatform.googleapis.com
            header: Authorization
            format: "Bearer %s"
