# syntax=docker/sandbox-kit:3
schemaVersion: "3"

kind: set
displayName: Pi GCP Development Environment
version: "0.2.0" # x-release-please-version

args:
  project:
    required: true
    description: GCP project used for Vertex AI

  location:
    default: global
    description: Vertex AI endpoint location

  version:
    default: "1.1.0"
    pattern: '^([0-9]+\.[0-9]+\.[0-9]+|latest)$'
    description: Pi release to install (e.g. 1.1.0, or latest)

kits:
  - ref: docker.io/docker/sbx-kit-pi:latest

  - ref: docker.io/christianhkb/sbx-kit-pi-version:0.2.0 # x-release-please-version
    args:
      version: "${{ kit.args.version }}"

  - ref: docker.io/christianhkb/sbx-kit-pi-gcp:0.2.0 # x-release-please-version
    args:
      project: "${{ kit.args.project }}"
      location: "${{ kit.args.location }}"

  - ref: docker.io/docker/sbx-kit-github-ssh:1.0.0

  - ref: docker.io/docker/sbx-kit-git-ssh-sign:1.0.0
