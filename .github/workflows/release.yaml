name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Checkout release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}

      - name: Set up Docker Buildx
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish pi-gcp
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/sbx-kit-pi-gcp
        run: |
          docker buildx build ./kits/pi-gcp \
            -f ./kits/pi-gcp/pi-gcp.yaml \
            --platform linux/amd64,linux/arm64 \
            --push \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest"

      - name: Verify pi-gcp is available
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/sbx-kit-pi-gcp
        run: |
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
              exit 0
            fi

            echo "Waiting for Docker Hub..."
            sleep 5
          done

          echo "Published pi-gcp could not be resolved"
          exit 1

      - name: Publish Pi GCP development set
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/sbx-kit-pi-gcp-dev
        run: |
          docker buildx build ./sets/pi-gcp-dev \
            -f ./sets/pi-gcp-dev/pi-gcp-dev.yaml \
            --platform linux/arm64 \
            --push \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:latest"
